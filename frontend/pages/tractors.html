<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>KisanSetu – Tractor Rental</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .avail-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .avail-pill {
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .avail-pill.all { background: var(--green-pale); color: var(--green-dark); border-color: var(--green-mid); }
    .avail-pill.avail { background: #e8f8f0; color: #166534; border-color: #22c55e; }
    .avail-pill.rented { background: var(--amber-light); color: #92400e; border-color: var(--amber); }
    .avail-pill.inactive { background: var(--bg); color: var(--text-light); border-color: var(--border); }
    .avail-pill.inactive.active, .avail-pill.all.active, .avail-pill.avail.active, .avail-pill.rented.active {
      opacity: 1; box-shadow: 0 0 0 3px rgba(45,122,79,0.25);
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon">🌾</span>
      <h1>KisanSetu</h1>
      <span>Smart Farm Management</span>
    </div>
    <nav>
      <a href="index.html" class="nav-item" data-page="dashboard"><span class="icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a href="tracker.html" class="nav-item" data-page="tracker"><span class="icon">💰</span><span class="nav-label">Expense & Income</span></a>
      <a href="schemes.html" class="nav-item" data-page="schemes"><span class="icon">🏛️</span><span class="nav-label">Govt. Schemes</span></a>
      <a href="tractors.html" class="nav-item active" data-page="tractors"><span class="icon">🚜</span><span class="nav-label">Tractor Rental</span></a>
      <a href="rentals.html" class="nav-item" data-page="rentals"><span class="icon">📋</span><span class="nav-label">Rental Ledger</span></a>
    </nav>
    <div class="sidebar-footer">KisanSetu v1.0</div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="mobile-toggle">☰</button>
        <h2>🚜 Tractor Rental</h2>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="openModal('addTractorModal')">➕ Add Tractor</button>
        <div class="farmer-badge"><div class="avatar">🧑‍🌾</div><span>Ram Patel</span></div>
      </div>
    </header>

    <main class="page-content">
      <div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
        <div class="stat-card green"><div class="icon-wrap">🚜</div><div class="label">Total Tractors</div><div class="value" id="sTotalT">—</div></div>
        <div class="stat-card green"><div class="icon-wrap">✅</div><div class="label">Available</div><div class="value" id="sAvailT">—</div></div>
        <div class="stat-card amber"><div class="icon-wrap">🔄</div><div class="label">Currently Rented</div><div class="value" id="sRentedT">—</div></div>
      </div>

      <div class="avail-bar">
        <span class="avail-pill all active" onclick="filterTractors(this,'')">🚜 All</span>
        <span class="avail-pill avail" onclick="filterTractors(this,'Available')">✅ Available</span>
        <span class="avail-pill rented" onclick="filterTractors(this,'Rented')">🔄 Rented</span>
      </div>

      <div class="tractor-grid" id="tractorGrid">
        <div class="empty-state"><div class="empty-icon">🔄</div><p>Loading tractors...</p></div>
      </div>
    </main>
  </div>

  <!-- ADD TRACTOR MODAL -->
  <div class="modal-overlay" id="addTractorModal">
    <div class="modal">
      <div class="modal-header">
        <h3>➕ Add Tractor</h3>
        <button class="modal-close" onclick="closeModal('addTractorModal')">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-group"><label>Tractor Model *</label><input type="text" id="tName" placeholder="e.g. Mahindra 575 DI"/></div>
        <div class="form-group"><label>Horsepower (HP)</label><input type="number" id="tHP" placeholder="e.g. 42"/></div>
        <div class="form-group"><label>Owner Name *</label><input type="text" id="tOwner" placeholder="e.g. Ram Lal Patel"/></div>
        <div class="form-group"><label>Rate per Day (₹) *</label><input type="number" id="tRateDay" placeholder="e.g. 2500"/></div>
        <div class="form-group"><label>Rate per Hour (₹)</label><input type="number" id="tRateHr" placeholder="e.g. 350"/></div>
        <div class="form-group"><label>Year</label><input type="number" id="tYear" placeholder="e.g. 2021"/></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addTractor()">Save Tractor</button>
        <button class="btn btn-outline" onclick="closeModal('addTractorModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- RENT MODAL -->
  <div class="modal-overlay" id="rentModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📋 New Rental</h3>
        <button class="modal-close" onclick="closeModal('rentModal')">✕</button>
      </div>
      <div style="background:var(--green-pale);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:16px;">
        <div id="rentTractorInfo" style="font-weight:700;color:var(--green-dark)"></div>
      </div>
      <input type="hidden" id="rentTractorId"/>
      <div class="form-grid">
        <div class="form-group"><label>Renter Name *</label><input type="text" id="rentName" placeholder="Farmer's name"/></div>
        <div class="form-group"><label>Phone *</label><input type="tel" id="rentPhone" placeholder="Mobile number"/></div>
        <div class="form-group"><label>Village</label><input type="text" id="rentVillage" placeholder="Village name"/></div>
        <div class="form-group"><label>Purpose</label><input type="text" id="rentPurpose" placeholder="e.g. Ploughing"/></div>
        <div class="form-group"><label>Start Date *</label><input type="date" id="rentStart"/></div>
        <div class="form-group"><label>End Date *</label><input type="date" id="rentEnd"/></div>
        <div class="form-group"><label>Advance Paid (₹)</label><input type="number" id="rentPaid" placeholder="0"/></div>
        <div class="form-group"><label>Payment Mode</label>
          <select id="rentMode"><option>Cash</option><option>UPI</option><option>Cheque</option><option>-</option></select>
        </div>
      </div>
      <div id="rentEstimate" style="background:var(--amber-light);border-radius:var(--radius-sm);padding:10px 14px;margin:10px 0;font-size:14px;display:none;"></div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="submitRental()">Confirm Rental</button>
        <button class="btn btn-outline" onclick="closeModal('rentModal')">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    let allTractors = [];
    let selectedFilter = '';
    let currentTractor = null;

    async function loadTractors() {
      const data = await apiFetch('/tractors');
      if (!data) return;
      allTractors = data;
      document.getElementById('sTotalT').textContent = data.length;
      document.getElementById('sAvailT').textContent = data.filter(t => t.status === 'Available').length;
      document.getElementById('sRentedT').textContent = data.filter(t => t.status === 'Rented').length;
      renderTractors(data.filter(t => !selectedFilter || t.status === selectedFilter));
    }

    function renderTractors(list) {
      const grid = document.getElementById('tractorGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🚜</div><p>No tractors found</p></div>';
        return;
      }
      const emojis = ['🚜','🚜','🚜','🚜'];
      grid.innerHTML = list.map((t,i) => {
        const avail = t.status === 'Available';
        return `
        <div class="tractor-card">
          <div class="tractor-thumb">
            <span style="font-size:60px">🚜</span>
            <div class="tractor-status-dot">
              <span class="badge ${avail ? 'badge-green' : 'badge-amber'}">${t.status}</span>
            </div>
          </div>
          <div class="tractor-body">
            <div class="tractor-name">${t.name}</div>
            <div class="tractor-meta">👤 ${t.owner} &nbsp;•&nbsp; ⚡ ${t.hp} HP &nbsp;•&nbsp; 📅 ${t.year||'—'}</div>
            <div class="tractor-price">${fmt(t.rate_per_day)} <span>/ day</span>
              ${t.rate_per_hour ? ` &nbsp; ${fmt(t.rate_per_hour)} <span>/ hr</span>` : ''}
            </div>
            <div style="display:flex;gap:8px;">
              ${avail
                ? `<button class="btn btn-primary btn-sm" onclick="openRent(${t.id})">🔑 Rent Out</button>`
                : `<span class="badge badge-amber" style="padding:7px 12px;">🔄 Currently Rented</span>`}
              <button class="btn btn-danger btn-sm" onclick="deleteTractor(${t.id})">🗑️</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function filterTractors(el, status) {
      document.querySelectorAll('.avail-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      selectedFilter = status;
      renderTractors(allTractors.filter(t => !status || t.status === status));
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    async function addTractor() {
      const name = document.getElementById('tName').value.trim();
      const owner = document.getElementById('tOwner').value.trim();
      const rateDay = parseFloat(document.getElementById('tRateDay').value);
      if (!name || !owner || !rateDay) return showToast('Please fill required fields', true);
      const body = {
        name, owner, rate_per_day: rateDay,
        hp: parseInt(document.getElementById('tHP').value) || 0,
        rate_per_hour: parseFloat(document.getElementById('tRateHr').value) || 0,
        year: parseInt(document.getElementById('tYear').value) || null,
        fuel_type: 'Diesel'
      };
      const res = await apiFetch('/tractors', { method: 'POST', body: JSON.stringify(body) });
      if (res) { showToast('✅ Tractor added!'); closeModal('addTractorModal'); loadTractors(); }
    }

    async function deleteTractor(id) {
      if (!confirm('Remove this tractor?')) return;
      await apiFetch('/tractors/' + id, { method: 'DELETE' });
      showToast('Tractor removed'); loadTractors();
    }

    function openRent(tid) {
      currentTractor = allTractors.find(t => t.id === tid);
      if (!currentTractor) return;
      document.getElementById('rentTractorId').value = tid;
      document.getElementById('rentTractorInfo').textContent = `🚜 ${currentTractor.name} — ${fmt(currentTractor.rate_per_day)}/day`;
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('rentStart').value = today;
      document.getElementById('rentEnd').value = today;
      document.getElementById('rentEstimate').style.display = 'none';
      openModal('rentModal');

      ['rentStart','rentEnd'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateEstimate);
      });
    }

    function updateEstimate() {
      const s = document.getElementById('rentStart').value;
      const e = document.getElementById('rentEnd').value;
      if (!s || !e || !currentTractor) return;
      const days = Math.max(Math.ceil((new Date(e) - new Date(s)) / 86400000), 1);
      const total = days * currentTractor.rate_per_day;
      const est = document.getElementById('rentEstimate');
      est.style.display = 'block';
      est.innerHTML = `⏱️ <strong>${days} day${days>1?'s':''}</strong> &nbsp;·&nbsp; Estimated Total: <strong>${fmt(total)}</strong>`;
    }

    async function submitRental() {
      const name = document.getElementById('rentName').value.trim();
      const phone = document.getElementById('rentPhone').value.trim();
      const start = document.getElementById('rentStart').value;
      const end = document.getElementById('rentEnd').value;
      if (!name || !phone || !start || !end) return showToast('Please fill required fields', true);
      const body = {
        tractor_id: parseInt(document.getElementById('rentTractorId').value),
        renter_name: name,
        renter_phone: phone,
        renter_village: document.getElementById('rentVillage').value,
        purpose: document.getElementById('rentPurpose').value,
        start_date: start, end_date: end,
        paid_amount: parseFloat(document.getElementById('rentPaid').value) || 0,
        payment_mode: document.getElementById('rentMode').value
      };
      const res = await apiFetch('/rentals', { method: 'POST', body: JSON.stringify(body) });
      if (res) {
        showToast('✅ Rental created! Tractor marked as Rented.');
        closeModal('rentModal');
        loadTractors();
      }
    }

    loadTractors();
  </script>
</body>
</html>
